name: Build and Release RPM

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: dnf install -y cpio desktop-file-utils gtk4 libadwaita python3 python3-gobject rpm-build

      - name: Validate source
        run: |
          python3 -m compileall -q fedora_store
          desktop-file-validate packaging/io.github.fedorastore.FedoraStore.desktop

      - name: Build RPM
        run: ./packaging/build-rpm.sh

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fedora-store-rpm
          path: .rpmbuild/RPMS/noarch/*.rpm
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: fedora-store-rpm
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.rpm --repo "$GITHUB_REPOSITORY" --generate-notes
